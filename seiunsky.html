<div class="reveal glass p-6 sm:p-10 grid md:grid-cols-2 gap-8 items-center"><div class="cons" id="cons"><div class="orbit"></div><svg viewBox="0 0 100 100" id="lines"></svg><div class="core">${img(D.heroImg,N)}</div></div><div id="relInfo" class="swap space-y-3 min-h-[15rem]"></div></div></section>`;

const media=`<section id="media-trivia" class="max-w-6xl mx-auto px-4 py-20 grid lg:grid-cols-2 gap-10"><div><div class="reveal mb-6"><span class="eyebrow">Media</span><h2 class="h2">${D.mediaTitle}</h2></div><div class="space-y-4">${D.media.map(m=>`<div class="reveal feat flex gap-4"><div class="ic shrink-0"><i class="${m.icon}"></i></div><div><div class="flex flex-wrap items-center gap-2"><span class="font-bold text-white">${m.label}</span><span class="chip !py-0.5 !text-[10px]" style="color:var(--p)">${m.badge}</span></div><p class="text-xs text-slate-300 mt-1.5 leading-relaxed">${m.text}</p></div></div>`).join('')}</div></div>

const nx=d=>{const m=M[(me+d+M.length)%M.length];return `<a href="${m.f}" class="ncard" style="--c:${m.c}">${img(m.img,m.n)}<div class="${d>0?'text-right ml-auto':''}"><div class="text-[10px] uppercase tracking-widest text-slate-400">${d>0?'Berikutnya':'Sebelumnya'}</div><div class="font-serif font-black text-lg text-white">${m.n}</div><div class="text-[11px]" style="color:${m.c}">${m.jp}</div></div></a>`};

$('#foot').innerHTML=`<p class="text-sm font-bold text-white">${D.footer[0]}</p><p class="text-xs text-slate-400 max-w-xl mx-auto">${D.footer[3]}</p><p class="text-[11px] text-slate-600">${D.footer[4]}</p>`;

/* ---------- WARDROBE ---------- */
function show(i,dir=1){oi=(i+D.outfits.length)%D.outfits.length;const o=D.outfits[oi];const st=$('#wArt');st.style.setProperty('--dir',dir);
 st.innerHTML=`<div class="a-glow"></div>${[0,1].map(k=>`<div class="a-ring" style="width:${62+k*22}cqmin;height:${62+k*22}cqmin;--d:${18+k*9}s;animation-direction:${k%2?'reverse':'normal'}"><i></i></div>`).join('')}${img(o.img,o.title,'a-img')}`;
 $('#wInfo').innerHTML=`<div style="--i:0" class="flex flex-wrap gap-2"><span class="chip on">${o.badge}</span><span class="chip">${o.type}</span><span class="chip" style="color:var(--g)"><i class="fa-solid fa-star"></i>${o.rarity}</span></div><h3 style="--i:1" class="font-serif font-black text-3xl sm:text-4xl text-white leading-tight">${o.title}</h3><p style="--i:2;color:var(--p)" class="text-sm italic font-semibold">${o.jpTitle}</p><p style="--i:3" class="text-sm text-slate-300 leading-relaxed">${o.description}</p><div style="--i:4" class="flex flex-wrap gap-1.5">${o.tags.map(t=>`<span class="chip !py-1 !text-[11px]">${t}</span>`).join('')}</div>`;
 $$('#wThumbs .thumb').forEach((b,k)=>b.classList.toggle('on',k===oi))}
const step=d=>show(oi+d,d);
function toggleAuto(){const b=$('#autoBtn');if(auto){clearInterval(auto);auto=null;b.classList.remove('on');b.firstChild.className='fa-solid fa-play'}else{auto=setInterval(()=>step(1),5000);b.classList.add('on');b.firstChild.className='fa-solid fa-pause'}}
show(0);
{const w=$('#wArt');let sx=null;w.addEventListener('pointerdown',e=>sx=e.clientX);w.addEventListener('pointerup',e=>{if(sx!==null&&Math.abs(e.clientX-sx)>50)step(e.clientX<sx?1:-1);sx=null})}
addEventListener('keydown',e=>{if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;const r=$('#variasi').getBoundingClientRect();if(r.top<innerHeight*.7&&r.bottom>innerHeight*.3)step(e.key==='ArrowRight'?1:-1)});

/* ---------- TABS + GAUGE ---------- */
const GR={S:100,A:90,B:75,C:60,D:45,E:30,F:15,G:5};
function fire(root){$$('.fg',root).forEach(c=>{const p=c.dataset.pct?+c.dataset.pct:(GR[c.dataset.g]||50);c.style.strokeDashoffset=226.2*(1-p/100)});
 $$('[data-count]',root).forEach(el=>{const to=+el.dataset.count,t0=performance.now();(function f(n){const p=Math.min((n-t0)/1200,1);el.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)})}
$$('#tabs .tab').forEach(b=>b.onclick=()=>{$$('#tabs .tab').forEach(x=>x.classList.toggle('on',x===b));$$('.panel').forEach(p=>{const on=p.dataset.p===b.dataset.t;p.classList.toggle('on',on);if(on)fire(p)})});
$('#idc').addEventListener('pointermove',e=>{const r=e.currentTarget.getBoundingClientRect();e.currentTarget.style.setProperty('--mx',((e.clientX-r.left)/r.width*100)+'%')});
$('#biografi').insertAdjacentHTML('beforeend','<svg width="0" height="0"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--p)"/><stop offset="1" stop-color="var(--s)"/></linearGradient></defs></svg>');

/* ---------- KONSTELASI RELASI ---------- */
{const n=D.rels.length,box=$('#cons'),ln=$('#lines');let h='',l='';
 D.rels.forEach((r,k)=>{const a=(-90+k*360/n)*Math.PI/180,x=50+37*Math.cos(a),y=50+37*Math.sin(a);const ms=r.links.map(([,f])=>M.find(m=>m.f===f)).filter(Boolean);const c=ms[0]?ms[0].c:'var(--p)';
  h+=`<button class="node" data-k="${k}" style="left:${x}%;top:${y}%;--nc:${c}"><div class="av">${ms.length?ms.map(m=>img(m.img,m.n)).join(''):`<i class="fa-solid fa-user-large"></i>`}</div><small>${r.name}</small></button>`;l+=`<line x1="50" y1="50" x2="${x}" y2="${y}" data-k="${k}"/>`});
 ln.innerHTML=l;box.insertAdjacentHTML('beforeend',h);
 const pick=k=>{const r=D.rels[k];$$('.node').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));$$('#lines line').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
  $('#relInfo').innerHTML=`<div style="--i:0"><span class="chip on">${r.label}</span></div><h3 style="--i:1" class="font-serif font-black text-3xl text-white">${r.name}</h3><p style="--i:2" class="text-sm text-slate-300 leading-relaxed">${r.desc}</p>${r.rel?`<p style="--i:3" class="text-xs font-bold" style="color:var(--p)"><i class="fa-solid fa-link mr-1"></i>${r.rel}</p>`:''}<div style="--i:4" class="flex flex-wrap gap-2 pt-1">${r.links.map(([t,f])=>`<a href="${f}" class="btn btn-p !py-2.5 !text-xs">${t}</a>`).join('')}</div>`};
 $$('.node').forEach(x=>x.onclick=()=>pick(+x.dataset.k));pick(0)}

/* ---------- TRIVIA ---------- */
function openAcc(i){$$('#acc .acc').forEach((a,k)=>a.classList.toggle('on',k===i&&!a.classList.contains('on')||false));}
function rndFact(){openAcc(Math.random()*D.trivia.length|0)}

/* ---------- KUIS ---------- */
const QT={'Ulang Tahun':'Kapan ulang tahun','Tinggi Badan':'Berapa tinggi badan','VA / Pengisi Suara':'Siapa pengisi suara','Favorit':'Apa yang menjadi favorit','Asal Tempat':'Dari mana asal','Ukuran B-W-H':'Berapa ukuran B-W-H','Kamar Asrama':'Di mana kamar asrama','Teman Kamar':'Siapa teman sekamar','Total Rekor Balap':'Berapa total rekor balap kuda pacu asli'};
let qs=[],qi=0,sc=0;
function startQuiz(){const all=[];Object.keys(QT).forEach(l=>{const own=Q[me][l];if(!own)return;const o=[...new Set(Q.map(c=>c[l]).filter(v=>v&&v!==own))];if(o.length<2)return;all.push({q:`${QT[l]} <b style="color:var(--p)">${N}</b>?`,a:own,o:shuf([own,...shuf(o).slice(0,3)])})});
 all.push({q:`Siapa pemilik semboyan <b class="font-serif" style="color:var(--p)">${D.motto}</b> ?`,a:N,o:shuf([N,...shuf(M.filter(m=>m.n!==N).map(m=>m.n)).slice(0,3)])});
 qs=shuf(all).slice(0,5);qi=0;sc=0;drawQ()}
function drawQ(){const z=$('#qz');if(qi>=qs.length){const p=sc/qs.length,msg=p===1?'Sempurna! Kamu fans sejati '+N+'!':p>=.6?'Bagus! Kamu cukup kenal '+N+'.':'Ayo kenalan lagi dengan '+N+'!';
  z.innerHTML=`<div class="text-center space-y-4"><i class="fa-solid ${I} text-4xl" style="color:var(--p)"></i><div class="font-serif font-black text-6xl gt">${sc}/${qs.length}</div><p class="text-slate-300">${msg}</p><div class="flex justify-center gap-3"><button class="btn btn-p" onclick="startQuiz()"><i class="fa-solid fa-rotate"></i>Main Lagi</button><a href="#pengenalan" class="btn btn-g">Baca Ulang</a></div></div>`;if(p>=.6&&window.burst)burst(innerWidth/2,innerHeight/2,26);return}
 const q=qs[qi];z.innerHTML=`<div class="swap"><div style="--i:0" class="flex justify-between items-center mb-4 text-xs text-slate-400"><span>Pertanyaan ${qi+1} / ${qs.length}</span><span>Skor: <b class="text-white">${sc}</b></span></div><div style="--i:1" class="h-1.5 rounded-full bg-white/10 mb-5 overflow-hidden"><div class="h-full rounded-full" style="width:${qi/qs.length*100}%;background:linear-gradient(90deg,var(--p),var(--s))"></div></div><p style="--i:2" class="font-bold text-white mb-4">${q.q}</p><div style="--i:3" class="space-y-2.5">${q.o.map(o=>`<button class="opt">${o}</button>`).join('')}</div></div>`;
 $$('.opt',z).forEach(b=>b.onclick=()=>{const ok=b.textContent===q.a;if(ok)sc++;$$('.opt',z).forEach(x=>{x.disabled=true;if(x.textContent===q.a)x.classList.add('ok')});if(!ok)b.classList.add('no');else if(window.burst){const r=b.getBoundingClientRect();burst(r.left+r.width/2,r.top,12)}setTimeout(()=>{qi++;drawQ()},1100)})}
startQuiz();

/* ---------- ANIMASI & INTERAKSI ---------- */
const ro=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('on');ro.unobserve(e.target)}}),{threshold:.1});
function go(){$$('.reveal').forEach((el,i)=>{if(el.closest('#pengenalan'))el.style.transitionDelay=(i*.1)+'s';ro.observe(el)});fire($('.panel.on'))}
addEventListener('gg-loaded',go);
{const q=D.quote,el=$('#qt');const o=new IntersectionObserver(es=>{if(es[0].isIntersecting){o.disconnect();let i=0;const t=setInterval(()=>{el.textContent=q.slice(0,++i);if(i>=q.length)clearInterval(t)},22)}});o.observe($('#quote'))}
{const a=$('#hArt');a.addEventListener('pointermove',e=>{const r=a.getBoundingClientRect();a.style.setProperty('--px',((e.clientX-r.left)/r.width*2-1).toFixed(2));a.style.setProperty('--py',((e.clientY-r.top)/r.height*2-1).toFixed(2))});a.addEventListener('pointerleave',()=>{a.style.setProperty('--px',0);a.style.setProperty('--py',0)})}
if(matchMedia('(hover:hover)').matches){const g=$('#glow');addEventListener('pointermove',e=>{g.style.transform=`translate(${e.clientX}px,${e.clientY}px)`},{passive:true})}
const spy=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)$$('#nav a').forEach(a=>a.classList.toggle('act',a.getAttribute('href')==='#'+e.target.id))}),{rootMargin:'-45% 0px -50% 0px'});SEC.forEach(([id])=>spy.observe($('#'+id)));
const onS=()=>{const m=document.documentElement.scrollHeight-innerHeight,p=m>0?scrollY/m:0;$('#prog').style.transform=`scaleX(${p})`;$('#top').classList.toggle('on',scrollY>700)};addEventListener('scroll',onS,{passive:true});onS();
$('#top').onclick=()=>scrollTo({top:0,behavior:'smooth'});$$('#mmenu a[href^="#"]').forEach(a=>a.addEventListener('click',()=>$('#mmenu').classList.add('hidden')));

/* ---------- FX: bintang + partikel tema + ledakan klik ---------- */
(()=>{const c=$('#fx'),x=c.getContext&&c.getContext('2d');if(!x)return;const fx=D.theme.fx,rgb=D.theme.rgb;let W,H,dpr;
 const rs=()=>{dpr=Math.min(devicePixelRatio||1,innerWidth<768?1.25:1.75);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px'};rs();addEventListener('resize',rs);
 const stars=Array.from({length:70},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.2+.3,a:Math.random()*6,v:Math.random()+.5}));
 const cloud=document.createElement('canvas');cloud.width=cloud.height=64;{const g=cloud.getContext('2d'),r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,`rgba(${rgb},.9)`);r.addColorStop(1,`rgba(${rgb},0)`);g.fillStyle=r;g.fillRect(0,0,64,64)}
 const star=(s,r)=>{x.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,d=i%2?r*.28:r;x.lineTo(s.x+Math.cos(a)*d,s.y+Math.sin(a)*d)}x.closePath();x.fill()};
 const spawn=(top)=>{const p={x:Math.random()*W,y:Math.random()*H,a:Math.random()*6,s:0,vx:0,vy:0,al:.3};
  if(fx==='sakura'||fx==='petal'){p.s=Math.random()*5+4;p.vy=40+Math.random()*50;p.vx=Math.random()*30-15;if(top)p.y=-20}
  else if(fx==='ember'){p.s=Math.random()*2.5+1.2;p.vy=-(30+Math.random()*70);p.vx=Math.random()*20-10;if(top)p.y=H+10}
  else if(fx==='cloud'){p.s=70+Math.random()*90;p.vx=8+Math.random()*18;p.y=Math.random()*H*.8;p.al=.05+Math.random()*.09;if(top)p.x=-p.s}
  else{p.s=Math.random()*5+3}return p};
 const P=Array.from({length:fx==='cloud'?9:fx==='sparkle'?26:22},()=>spawn(false)),B=[];
 window.burst=(bx,by,n=14)=>{for(let i=0;i<n;i++){const a=Math.random()*6.283,v=70+Math.random()*190;B.push({x:bx,y:by,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(fx==='ember'?60:0),life:0,max:.7+Math.random()*.6,s:3+Math.random()*5,a})}};
 addEventListener('pointerdown',e=>{if(e.target.closest('a,button,input'))return;burst(e.clientX,e.clientY)});
 let last=performance.now();
 (function loop(now){const dt=Math.min((now-last)/1000,.05),t=now/1000;last=now;x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);
  x.fillStyle='#fff';stars.forEach(s=>{x.globalAlpha=.25+.6*Math.abs(Math.sin(t*s.v+s.a));x.beginPath();x.arc(s.x*W,s.y*H,s.r,0,6.283);x.fill()});
  x.fillStyle=`rgb(${rgb})`;
  P.forEach((p,i)=>{p.a+=dt;
   if(fx==='sakura'||fx==='petal'){p.y+=p.vy*dt;p.x+=(p.vx+Math.sin(p.a*1.5)*20)*dt;x.globalAlpha=.45;x.save();x.translate(p.x,p.y);x.rotate(p.a*1.5);x.beginPath();x.ellipse(0,0,p.s,p.s/2,0,0,6.283);x.fill();x.restore();if(p.y>H+20)P[i]=spawn(true)}
   else if(fx==='ember'){p.y+=p.vy*dt;p.x+=(p.vx+Math.sin(p.a*3)*14)*dt;x.globalAlpha=.25+.55*Math.abs(Math.sin(p.a*4));x.beginPath();x.arc(p.x,p.y,p.s,0,6.283);x.fill();if(p.y<-10)P[i]=spawn(true)}
   else if(fx==='cloud'){p.x+=p.vx*dt;x.globalAlpha=p.al;x.drawImage(cloud,p.x-p.s,p.y-p.s,p.s*2,p.s*2);if(p.x>W+p.s)P[i]=spawn(true)}
   else{x.globalAlpha=.15+.75*Math.abs(Math.sin(p.a*1.6));star(p,p.s)}});
  for(let i=B.length-1;i>=0;i--){const b=B[i];b.life+=dt;if(b.life>b.max){B.splice(i,1);continue}b.x+=b.vx*dt;b.y+=b.vy*dt;b.vy+=(fx==='ember'?-20:120)*dt;b.vx*=.985;const k=1-b.life/b.max;x.globalAlpha=k;x.fillStyle=i%3?`rgb(${rgb})`:'#f59e0b';
   if(fx==='petal'){x.save();x.translate(b.x,b.y);x.rotate(b.a);x.fillRect(-b.s*2.5,-1,b.s*5*k,2);x.restore()}
   else if(fx==='sparkle')star(b,b.s*1.6*k+2);else if(fx==='cloud'){x.drawImage(cloud,b.x-b.s*3*(2-k),b.y-b.s*3*(2-k),b.s*6*(2-k),b.s*6*(2-k))}
   else{x.beginPath();x.ellipse(b.x,b.y,b.s*k+1,(b.s*k+1)/(fx==='sakura'?2:1),b.a,0,6.283);x.fill()}}
  x.globalAlpha=1;requestAnimationFrame(loop)})(last);
})();
</script></body></html>
